name: Feature request
description: Suggest an improvement or new capability
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's missing?
      description: Describe the workflow or capability you need.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any workarounds you use today?
