name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    # GITHUB_TOKEN defaults to read-only; creating a Release needs contents: write
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (release)
        run: npx tauri build

      - name: Sign installer (self-signed cert, trusted on user machines)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX }}
          PFX_PASS: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:PFX_B64)) {
            Write-Host "WINDOWS_SIGNING_PFX secret not set — skipping signing"
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:PFX_B64)
          $pfxPath = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Using signtool: $signtool"
          $installer = (Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1).FullName
          Write-Host "Signing: $installer"
          & $signtool sign /f $pfxPath /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $installer
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }

      - name: Verify signature
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1).FullName
          $sig = Get-AuthenticodeSignature -FilePath $installer
          Write-Host "Signature status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          # Status here will be Valid OR UnknownError: UnknownError means the chain
          # isn't trusted ON THIS RUNNER (self-signed root not installed here — it's
          # installed on the USER's PC). Both prove a signature exists. Only
          # NotSigned (no signature at all) is a real failure.
          if ($sig.Status -eq 'NotSigned') { throw "installer is NOT signed" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LlamaStudio-setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Show artifacts
        shell: bash
        run: ls -la src-tauri/target/release/bundle/nsis/

      # On a v* tag push, also publish a GitHub Release with the installer.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
